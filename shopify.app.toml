# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "9f8d8ce3e71355bdf6f7137cdfe5738d"
application_url = "https://online-sync.firgelli-inventory-sync.workers.dev"
embedded = true
name = "OnlineSync"

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
topics = ["inventory_levels/update"]
uri = "/webhooks/inventory"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "/webhooks/uninstalled"

[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "/webhooks/compliance"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,read_inventory,write_inventory,read_locations"
optional_scopes = [ "write_products", "read_files" ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ ]

[[webhooks.subscriptions]]
topics = ["products/update", "products/create"]
uri = "/webhooks/products"
